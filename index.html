<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta Northern Blade | SLAX</title>
    <style>
        /* نظام الألوان والمتغيرات */
        :root {
            --red: #ff0000;
            --dark-red: #8b0000;
            --glass: rgba(10, 10, 10, 0.8);
            --border: rgba(255, 0, 0, 0.25);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            margin: 0; 
            background: #000; 
            color: white;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh; 
            overflow: hidden;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* خلفية الفيديو */
        .video-container { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: -2; 
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.45) contrast(1.1); 
        }

        .overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.85) 100%); 
            z-index: -1; 
        }

        /* زر التحكم بالصوت الاحترافي */
        .audio-toggle {
            position: fixed; 
            top: 30px; 
            right: 30px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            z-index: 100; 
            transition: 0.3s;
        }

        .audio-toggle:active { transform: scale(0.9); }

        .speaker-box {
            width: 22px; height: 16px; 
            display: flex; 
            align-items: center; 
            position: relative;
        }

        .speaker-body {
            width: 7px; height: 8px; 
            background: white; 
            position: relative;
            z-index: 2;
        }

        .speaker-head {
            width: 0; height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 12px solid white;
            margin-left: -1px;
        }

        .mute-line {
            position: absolute; 
            width: 28px; height: 2px; 
            background: var(--red);
            transform: rotate(45deg); 
            z-index: 10; 
            border-radius: 2px;
            transition: 0.2s;
        }

        /* الكارد الزجاجي (Glassmorphism) */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px; 
            padding: 50px 25px;
            width: 90%; 
            max-width: 380px; 
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
        }

        /* تحسين النصوص */
        .title {
            font-size: 3rem; 
            font-weight: 900; 
            margin: 0;
            background: linear-gradient(180deg, #fff 40%, var(--red) 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-flex; 
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            color: #00ff64; 
            padding: 8px 16px;
            border-radius: 50px; 
            font-size: 0.8rem; 
            font-weight: bold;
            margin: 20px 0; 
            border: 1px solid rgba(0, 255, 100, 0.2);
            letter-spacing: 0.5px;
        }

        .dot { 
            height: 8px; width: 8px; 
            background: #00ff64; 
            border-radius: 50%; 
            margin-left: 10px; 
            box-shadow: 0 0 15px #00ff64; 
            animation: blink 1.2s infinite; 
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .desc { 
            font-size: 1.05rem; 
            color: #e0e0e0; 
            line-height: 1.6; 
            margin-bottom: 30px;
        }

        /* الزر الرئيسي */
        .btn-main {
            display: block; 
            background: linear-gradient(90deg, var(--dark-red), var(--red));
            color: white; 
            text-decoration: none; 
            padding: 20px;
            border-radius: 20px; 
            font-weight: 800; 
            font-size: 1.2rem;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(255, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .btn-main:active { transform: scale(0.95); }

        .footer { 
            margin-top: 30px; 
            font-size: 0.75rem; 
            color: #777; 
            font-weight: bold;
            letter-spacing: 1px;
        }

        .footer span { color: var(--red); }
    </style>
</head>
<body>

    <div class="audio-toggle" onclick="toggleAudio()" title="تشغيل/إيقاف الصوت">
        <div class="speaker-box">
            <div class="speaker-body"></div>
            <div class="speaker-head"></div>
            <div class="mute-line" id="muteLine"></div>
        </div>
    </div>

    <div class="video-container">
        <video id="bgVideo" autoplay loop playsinline muted>
            <source src="https://www.image2url.com/r2/default/videos/1778594033993-18a9b464-4caf-45d4-9542-27b57ee7fbd8.mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="glass-card">
        <h1 class="title">DELTA</h1>
        
        <div class="status-badge">
            <span class="dot"></span>
            IPA V2.64 | ONLINE
        </div>

        <p class="desc">استمتع بتشغيل سكريبتاتك المفضلة بأعلى استقرار</p>
        
        <a href="https://github.com/mohanad9539229-boop/AIMBOT-DEAD-RAILS/releases/download/v2.720/Delta-2.720.1164.ipa" class="btn-main">DOWNLOAD IPA</a>
        
        <p class="footer">🗡️ NORTHERN BLADE IS THE <span>GOAT</span></p>
    </div>

    <script>
        function toggleAudio() {
            var video = document.getElementById("bgVideo");
            var muteLine = document.getElementById("muteLine");
            if (video.muted) {
                video.muted = false;
                muteLine.style.opacity = "0";
            } else {
                video.muted = true;
                muteLine.style.opacity = "1";
            }
        }
    </script>

</body>
</html>
